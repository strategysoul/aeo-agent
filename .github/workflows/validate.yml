name: validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin and marketplace
        run: claude plugin validate --strict .

      - name: Unit tests (no network, no keys)
        run: |
          python -m pip install --quiet pytest
          python -m pytest scripts/tests -q

      - name: Check the example site
        run: python scripts/check_site.py examples/example-site/northpine-running.example

      - name: Scan for keys and personal data
        run: python scripts/scan_repo.py

      - name: Check skill length
        run: |
          for f in skills/*/SKILL.md; do
            n=$(wc -w < "$f")
            echo "$f: $n words"
            if [ "$n" -gt 3000 ]; then echo "::error file=$f::over 3,000 words"; exit 1; fi
          done

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          v=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} but plugin.json says $v"; exit 1; }

      - name: Build aeo-agent.plugin
        # git archive leaves out paths marked export-ignore in .gitattributes (tests, examples, CI)
        run: git archive --format=zip -o aeo-agent.plugin HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" aeo-agent.plugin --title "${GITHUB_REF_NAME}" --generate-notes
